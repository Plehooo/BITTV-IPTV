name: Build BITTV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Java and Gradle
        run: |
          java -version
          cd android
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --max-workers=2

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: BITTV-APK-${{ github.run_number }}
    path: android/app/build/outputs/apk/debug/app-debug.apk
    if-no-files-found: error
      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Java and Gradle
        run: |
          java -version
          cd android
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --max-workers=2

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BITTV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
