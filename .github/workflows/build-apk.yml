name: Build BITTV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BITTV Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show environment
        run: |
          echo "===== NODE ====="
          node -v
          echo "===== NPM ====="
          npm -v
          echo "===== JAVA ====="
          java -version

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Capacitor
        run: |
          npx cap --version

      - name: Prepare Android project
        run: |
          if [ ! -d "android" ]; then
            echo "Android project belum ada."
            echo "Membuat Android project..."
            npx cap add android
          else
            echo "Android project sudah ada."
          fi

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Check Gradle
        run: |
          cd android
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain --max-workers=2

      - name: Verify APK
        run: |
          echo "===== CHECK APK ====="
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/BITTV-IPTV-${{ github.run_id }}-${{ github.run_attempt }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BITTV-APK-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Success
        if: success()
        run: |
          echo "======================================"
          echo "       BITTV APK BUILD SUCCESS"
          echo "======================================"
          echo "APK berhasil dibuat."
          echo "Silakan buka bagian Artifacts."
          echo "======================================"
